name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      # 1. Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js with dependency caching
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Clean install dependencies based on package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Check formatting / linting (optional)
      - name: Lint code
        run: npm run lint --if-present

      # 5. Build project (if applicable)
      - name: Build project
        run: npm run build --if-present

      # 6. Run test suite
      - name: Run tests
        run: npm test
